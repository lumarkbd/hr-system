<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumark HR</title>

    storageBucket: "lumarkbd.firebasestorage.app",

<style>
:root {
  --bg:#0f1117;
  --bg2:#161b27;
  --surface:#1a2035;
  --surface2:#1e2640;
  --surface3:#242d4a;
  --border:rgba(255,255,255,0.08);
  --border2:rgba(255,255,255,0.14);
  --border3:rgba(255,255,255,0.25);
  --text:#e8eaf6;
  --text2:#8892b0;
  --text3:#4a5568;
  --accent:#ffffff;
  --accent2:#e0e0e0;
  --accent-bg:rgba(255,255,255,0.08);
  --green:#00e676;
  --green-bg:rgba(0,230,118,0.1);
  --red:#ff5252;
  --red-bg:rgba(255,82,82,0.1);
  --amber:#ffab40;
  --amber-bg:rgba(255,171,64,0.1);
  --teal:#00bcd4;
  --teal-bg:rgba(0,188,212,0.1);
  --glass:rgba(255,255,255,0.04);
  --glass2:rgba(255,255,255,0.07);
  --glow:0 0 20px rgba(255,255,255,0.08);
  --shadow:0 4px 24px rgba(0,0,0,0.4);
  --shadow-lg:0 8px 40px rgba(0,0,0,0.5);
  --radius:14px; --radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,'Noto Sans TC',sans-serif;background:#060d1a;color:var(--text);min-height:100vh;font-size:14px;line-height:1.6;overflow-x:hidden;}
#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;}
#app{position:relative;z-index:1;}

#app{display:flex;flex-direction:column;min-height:100vh;position:relative;z-index:1;}

/* Topbar */
.topbar{background:rgba(7,14,26,0.8);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid rgba(100,160,255,0.12);padding:0 20px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.topbar-brand{font-size:17px;font-weight:800;color:#fff;letter-spacing:-.4px;white-space:nowrap;}
.topbar-nav{display:flex;align-items:center;gap:2px;margin:0 16px;}
.nav-item{display:flex;align-items:center;gap:6px;padding:6px 12px;cursor:pointer;color:var(--text2);font-size:13px;font-weight:500;border-radius:99px;transition:all .2s;border:1px solid transparent;white-space:nowrap;}
.nav-item:hover{background:var(--glass2);color:var(--text);}
.nav-item.active{background:rgba(30,100,255,0.2);color:#fff;border-color:rgba(100,180,255,0.3);font-weight:600;}
.nav-icon{font-size:14px;}
.nav-badge{background:#ff4d6d;color:#fff;border-radius:99px;font-size:10px;padding:1px 6px;font-weight:700;}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.user-chip{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;background:rgba(100,160,255,0.06);border:1px solid rgba(100,160,255,0.18);border-radius:99px;backdrop-filter:blur(8px);}
.user-avatar{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.2);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,0.3);}
.user-name{font-size:13px;font-weight:600;color:var(--text2);}
.user-role-badge{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600;}
.role-ceo{background:rgba(255,171,64,0.12);color:#ffab40;border:1px solid rgba(255,171,64,0.25);}
.role-manager{background:rgba(30,100,255,0.15);color:#90b8ff;border:1px solid rgba(100,180,255,0.25);}
.role-staff{background:var(--glass);color:var(--text2);border:1px solid var(--border2);}
.btn-logout{background:none;border:1px solid var(--border2);border-radius:var(--radius-sm);padding:6px 14px;font-size:13px;color:var(--text2);cursor:pointer;transition:all .2s;}
.btn-logout:hover{background:var(--glass2);color:var(--text);}

/* Mobile nav */
.mobile-nav{display:none;background:rgba(7,14,26,0.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid rgba(100,160,255,0.12);padding:8px 12px;position:fixed;bottom:0;left:0;right:0;z-index:100;justify-content:space-around;}
.mobile-nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 12px;cursor:pointer;color:var(--text3);font-size:10px;font-weight:500;border-radius:var(--radius-sm);transition:all .2s;position:relative;}
.mobile-nav-item.active{color:#fff;background:rgba(30,100,255,0.2);}
.mobile-nav-item .nav-icon{font-size:20px;}
.mobile-nav-badge{position:absolute;top:4px;right:8px;background:#ff4d6d;color:#fff;border-radius:99px;font-size:9px;padding:0 5px;font-weight:700;}

@media(max-width:768px){
  .topbar-nav{display:none;}
  .mobile-nav{display:flex;}
  .user-name{display:none;}
  .topbar{padding:0 12px;}
  .main{padding-bottom:80px;}
}

/* Layout */
.layout{display:flex;flex:1;justify-content:center;padding:28px 20px 48px;}
.main{width:100%;max-width:860px;}

/* Cards */
.card{background:rgba(13,28,57,0.65);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(100,160,255,0.15);border-top:1px solid rgba(255,255,255,0.08);border-radius:var(--radius);padding:24px;margin-bottom:20px;box-shadow:var(--glow-card);}
.card-title{font-size:15px;font-weight:600;margin-bottom:16px;color:var(--text);letter-spacing:.3px;}
.page-title{font-size:18px;font-weight:700;margin-bottom:16px;color:var(--text);letter-spacing:.3px;}

/* Buttons */
.btn{padding:8px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .2s;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--accent);color:#0f1117;font-weight:700;}
.btn-primary:hover{background:var(--accent2);transform:translateY(-1px);box-shadow:0 0 24px rgba(0,229,255,0.4);}
.btn-success{background:var(--green);color:#0f1117;font-weight:700;box-shadow:0 0 12px rgba(0,230,118,0.2);}
.btn-success:hover{opacity:.85;transform:translateY(-1px);}
.btn-danger{background:var(--red);color:#fff;font-weight:700;box-shadow:0 0 12px rgba(255,82,82,0.2);}
.btn-danger:hover{opacity:.85;transform:translateY(-1px);}
.btn-outline{background:var(--glass);border:1px solid var(--border2);color:var(--text);}
.btn-outline:hover{background:var(--glass2);border-color:var(--border3);}
.btn-sm{padding:5px 12px;font-size:12px;}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;}

/* Forms */
.form-group{margin-bottom:14px;}
.form-label{display:block;font-size:13px;font-weight:500;margin-bottom:5px;color:var(--text2);}
.form-control{width:100%;padding:9px 13px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;color:var(--text);background:var(--surface2);transition:all .2s;}
.form-control:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,229,255,0.12);}
select.form-control{cursor:pointer;}
textarea.form-control{resize:vertical;min-height:80px;}

/* Badges */
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;}
.badge-pending{background:var(--amber-bg);color:var(--amber);border:1px solid rgba(255,171,64,0.3);}
.badge-manager_approved{background:var(--teal-bg);color:var(--teal);border:1px solid rgba(0,188,212,0.3);}
.badge-approved{background:var(--green-bg);color:var(--green);border:1px solid rgba(0,230,118,0.3);}
.badge-rejected{background:var(--red-bg);color:var(--red);border:1px solid rgba(255,82,82,0.3);}
.badge-late{background:var(--red-bg);color:var(--red);border:1px solid rgba(255,82,82,0.3);}
.badge-on-time{background:var(--green-bg);color:var(--green);border:1px solid rgba(0,230,118,0.3);}

/* 統一頁首 */
.page-card{padding:0;overflow:hidden;}
.page-header{display:flex;align-items:center;gap:12px;padding:14px 20px;background:rgba(255,255,255,0.02);border-bottom:1px solid rgba(100,160,255,0.1);flex-wrap:wrap;}
.page-header-brand{font-size:15px;font-weight:700;color:#fff;letter-spacing:.5px;margin-right:4px;white-space:nowrap;}
.page-header-nav{display:flex;align-items:center;gap:2px;flex:1;}
.page-header-user{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0;}
.clock-nav-item{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:99px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .15s;border:1px solid transparent;position:relative;white-space:nowrap;}
.clock-nav-item:hover{background:var(--glass2);color:var(--text);}
.clock-nav-item.active{background:rgba(30,100,255,0.2);color:#fff;border-color:rgba(100,180,255,0.3);font-weight:600;}
.page-content-title{font-size:16px;font-weight:600;margin-bottom:16px;color:var(--text2);letter-spacing:.5px;text-transform:uppercase;}
@media(max-width:768px){
  .page-header{gap:10px;}
  .page-header-nav{order:3;width:100%;flex-wrap:wrap;}
  .page-header-user .user-name{display:none;}
  .page-header-user .btn-logout{display:none;}
}

/* Clock */
.clock-display{text-align:center;padding:32px 24px;}
.clock-time{font-size:64px;font-weight:700;letter-spacing:-3px;color:#fff;margin-bottom:6px;font-variant-numeric:tabular-nums;}
.clock-date{font-size:14px;color:var(--text2);margin-bottom:28px;font-weight:400;letter-spacing:.5px;}
.clock-btns{display:flex;gap:16px;justify-content:center;}
.clock-btn{padding:16px 40px;font-size:15px;font-weight:700;border-radius:var(--radius);border:none;cursor:pointer;transition:all .2s;}
.clock-btn-in{background:var(--green);color:#0f1117;font-weight:700;box-shadow:0 0 24px rgba(0,230,118,0.3);}
.clock-btn-in:hover{opacity:.85;transform:translateY(-2px);box-shadow:0 0 32px rgba(0,230,118,0.4);}
.clock-btn-out{background:var(--red);color:#fff;font-weight:700;box-shadow:0 0 20px rgba(255,82,82,0.25);}
.clock-btn-out:hover{opacity:.85;transform:translateY(-2px);}
.clock-btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important;box-shadow:none;}
.clock-status{margin-top:20px;padding:12px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;display:inline-block;}
.clock-status.clocked-in{background:var(--green-bg);color:var(--green);border:1px solid rgba(0,230,118,0.3);}
.clock-status.clocked-out{background:var(--glass);color:var(--text2);border:1px solid var(--border2);}

/* Progress */
.progress-bar{height:4px;background:rgba(100,160,255,0.1);border-radius:99px;overflow:hidden;margin-top:6px;}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--blue2));transition:width .4s ease;box-shadow:0 0 8px rgba(30,144,255,0.4);}
.progress-fill.warn{background:linear-gradient(90deg,#f57c00,#ffab40);}
.progress-fill.danger{background:linear-gradient(90deg,#c62828,#ff5252);}

/* Quota */
.quota-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
.quota-card{padding:16px;border-radius:var(--radius-sm);background:rgba(13,28,57,0.5);backdrop-filter:blur(10px);border:1px solid rgba(100,160,255,0.12);transition:all .2s;}
.quota-card:hover{transform:translateY(-2px);border-color:rgba(100,180,255,0.3);box-shadow:0 8px 24px rgba(30,100,255,0.15);}
.quota-name{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
.quota-nums{font-size:22px;font-weight:800;color:#fff;}
.quota-nums span{font-size:12px;font-weight:400;color:var(--text3);}
.quota-unlimited{font-size:11px;color:var(--purple);background:var(--purple-bg);padding:2px 8px;border-radius:99px;font-weight:600;display:inline-block;margin-top:4px;}

/* Table */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;padding:10px 14px;font-size:11px;font-weight:600;color:rgba(100,160,255,0.6);border-bottom:1px solid rgba(100,160,255,0.12);white-space:nowrap;letter-spacing:.8px;text-transform:uppercase;}
td{padding:12px 14px;font-size:13px;border-bottom:1px solid rgba(100,160,255,0.06);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(30,100,255,0.06);}
.empty-state{text-align:center;padding:40px;color:var(--text3);font-size:14px;}

/* Login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;}
.login-card{background:rgba(10,22,48,0.75);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid rgba(100,160,255,0.2);border-top:1px solid rgba(255,255,255,0.08);border-radius:24px;padding:44px 40px;width:380px;box-shadow:0 24px 64px rgba(0,0,0,0.6),var(--glow-blue);}
.login-logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,rgba(30,100,255,0.5),rgba(0,160,255,0.4));border:1px solid rgba(100,180,255,0.3);display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 20px;box-shadow:0 4px 20px rgba(30,100,255,0.3);}
.login-brand{font-size:22px;font-weight:800;color:#fff;text-align:center;margin-bottom:4px;letter-spacing:1px;}
.login-sub{color:var(--text2);font-size:13px;margin-bottom:28px;text-align:center;}
.login-card .form-label{color:var(--text2);}
.login-error{color:#fca5a5;font-size:13px;margin-bottom:10px;display:none;text-align:center;}
.login-btn-wrap{position:relative;}
.login-spinner{display:none;position:absolute;right:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:translateY(-50%) rotate(360deg);}}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(2,8,20,0.75);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;}
.modal{background:var(--surface2);border:1px solid var(--border2);border-radius:20px;padding:28px;width:100%;max-width:480px;box-shadow:var(--shadow-lg);}
.modal-title{font-size:17px;font-weight:700;margin-bottom:18px;color:var(--text);}
.modal-title{color:var(--accent);}
.modal .form-label{color:var(--text2);}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;}
.modal .btn-outline{background:var(--glass);border-color:var(--border2);color:var(--text);}

/* 打卡彈窗通知 */
.checkin-popup-overlay{position:fixed;inset:0;background:rgba(2,8,20,0.7);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px;animation:fadeIn .3s ease;}
.checkin-popup{background:var(--surface2);border-radius:28px;padding:40px 36px;text-align:center;max-width:380px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,0.6);animation:popIn .4s cubic-bezier(.34,1.56,.64,1);border:1px solid var(--border3);}
.checkin-popup-icon{font-size:64px;margin-bottom:16px;animation:bounce 1s ease infinite alternate;}
.checkin-popup-title{font-size:22px;font-weight:800;color:#fff;margin-bottom:8px;letter-spacing:.3px;}
.checkin-popup-msg{font-size:15px;color:var(--text2);margin-bottom:24px;line-height:1.6;}
.checkin-popup-time{font-size:13px;color:var(--text3);margin-bottom:24px;}
.checkin-popup-btn{background:linear-gradient(135deg,rgba(30,100,255,0.6),rgba(0,160,255,0.5));color:#fff;border:1px solid rgba(100,180,255,0.3);padding:12px 32px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;width:100%;transition:all .2s;box-shadow:0 4px 16px rgba(30,100,255,0.25);}
.checkin-popup-btn:hover{background:linear-gradient(135deg,rgba(30,100,255,0.75),rgba(0,160,255,0.65));transform:translateY(-1px);}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes bounce{from{transform:scale(1)}to{transform:scale(1.15)}}

/* Approval stages */
.approval-stages{display:flex;align-items:center;gap:6px;margin-top:6px;}
.stage-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text3);}
.stage-dot{width:8px;height:8px;border-radius:50%;background:var(--border2);border:1px solid var(--border2);}
.stage-dot.done{background:var(--green);border-color:var(--green);}
.stage-dot.active{background:var(--amber);border-color:var(--amber);}
.stage-dot.rejected{background:var(--red);border-color:var(--red);}
.stage-arrow{color:var(--text3);font-size:10px;}

/* Settings */
.settings-user-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
.settings-user-row:last-child{border-bottom:none;}
.notif-row{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
.notif-row:last-child{border-bottom:none;}
.notif-label{font-size:12px;font-weight:600;color:var(--text2);min-width:110px;padding-top:9px;}
.notif-input{flex:1;}

/* Misc */
.flex{display:flex;} .items-center{align-items:center;} .gap-8{gap:8px;} .gap-12{gap:12px;}
.ml-auto{margin-left:auto;} .text-sm{font-size:12px;} .text-muted{color:var(--text2);}
.fw-600{font-weight:600;} .fw-700{font-weight:700;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.toast{position:fixed;bottom:28px;right:28px;background:rgba(10,22,48,0.9);backdrop-filter:blur(20px);border:1px solid rgba(100,160,255,0.2);color:var(--text);padding:12px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;z-index:999;transform:translateY(80px);opacity:0;transition:all .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;box-shadow:var(--shadow-lg);}
.toast.show{transform:translateY(0);opacity:1;}
@media(max-width:768px){.toast{bottom:90px;right:16px;left:16px;}}
.divider{border:none;border-top:1px solid rgba(255,255,255,0.06);margin:16px 0;}
.dow-btn{padding:4px 10px;border-radius:6px;font-size:12px;font-weight:500;border:1px solid var(--border2);color:var(--text2);background:var(--glass);cursor:pointer;transition:all .15s;}
.dow-btn:hover{border-color:rgba(255,255,255,0.3);color:#fff;}
.dow-btn.active{background:rgba(30,100,255,0.3);color:#fff;border-color:rgba(100,180,255,0.4);font-weight:700;}
.tag-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.filter-tag{padding:5px 14px;border-radius:99px;font-size:12px;font-weight:500;border:1px solid var(--border2);color:var(--text2);cursor:pointer;background:var(--glass);transition:all .2s;}
.filter-tag:hover{background:var(--glass2);color:var(--text);}
.filter-tag.active{background:rgba(30,100,255,0.25);color:#fff;border-color:rgba(100,180,255,0.35);}
.loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
.loading-spinner{width:40px;height:40px;border:3px solid rgba(0,229,255,0.15);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;box-shadow:var(--glow);}
.loading-text{color:var(--text2);font-size:14px;font-weight:400;letter-spacing:.5px;}

<canvas id="bg-canvas"></canvas>
<style>
/* Noise texture overlay */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: .025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  background-size: 200px 200px;
}

<body>

<script>
const CONFIG = {
  SHEET_API_URL: 'https://script.google.com/macros/s/AKfycbwFHJTrZMXj5skNoDTwF4a7jeyYggpb3uaxHZ3dVsjOuLEutT9PgsVUy3CIcGZZUB5v/exec',
  CHECKIN_TIME: '09:30',
  OFFICE_LAT: 25.059912319926653,
  OFFICE_LNG: 121.51843625365498,

};

const DEFAULT_NOTIF_MESSAGES = {
  first:   '🎉 恭喜你是今天第一個到公司的！',
  second:  '☀️ 早安！你是今天第二個到的',
  others:  '👋 早安 {name}，今天第 {n} 個到！',
  ontime:  '👍 {name} 準時上班，讚！',
  late:    '⏰ {name}，今天晚了一點，加油！',
  checkout:'🌙 {name} 辛苦了，今天工時 {hours} 小時！',
};

const DEFAULT_NOTIF_CARDS = [
  { label:'第 1 位打卡',  message:'🎉 恭喜你是今天第一個到公司的！' },
  { label:'第 2 位打卡',  message:'☀️ 早安！你是今天第二個到的' },
  { label:'第 3 位以後',  message:'👋 早安 {name}，今天第 {n} 個到！' },
  { label:'準時打卡',     message:'👍 {name} 準時上班，讚！' },
  { label:'遲到打卡',     message:'⏰ {name}，今天晚了一點，加油！' },
  { label:'下班打卡',     message:'🌙 {name} 辛苦了，今天工時 {hours} 小時！' },
];

const LEAVE_TYPES = [
  { id:'annual',    name:'特休',        quota:0,  unlimited:false, dynamic:true },
  { id:'sick',      name:'病假',        quota:30, unlimited:false },
  { id:'personal',  name:'事假',        quota:14, unlimited:false },
  { id:'wedding',   name:'婚假',        quota:0,  unlimited:true },
  { id:'funeral',   name:'喪假',        quota:0,  unlimited:true },
  { id:'maternity', name:'產假/陪產假', quota:0,  unlimited:true },
];

const STATUS_LABEL = {
  pending:          '待主管審批',
  manager_approved: '待CEO確認',
  approved:         '已核准',
  rejected:         '已拒絕',
};

const S = {
  currentUser: null,
  page: 'clock',
  employees: [],
  attendance: [],
  leaves: [],
  modal: null,
  _rejectTarget: null,
  _recFilter: null,
  notifMessages: null,
  notifCards: null,
  remoteSettings: {},
  appReady: false,
};

// ── Storage ──
const LS = {
  get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set: (k,v) => localStorage.setItem(k, JSON.stringify(v)),
};
function loadLocalData() {
  S.attendance    = LS.get('hr_attendance') || [];
  S.leaves        = LS.get('hr_leaves')     || [];
  S.employees     = LS.get('hr_employees')  || [];
  S.notifMessages = LS.get('hr_notif_messages') || { ...DEFAULT_NOTIF_MESSAGES };
  S.remoteSettings = LS.get('hr_remote_settings') || {};
  S.notifCards = LS.get('hr_notif_cards') || [...DEFAULT_NOTIF_CARDS];
}
function saveAttendance() { LS.set('hr_attendance', S.attendance); }
function saveLeaves()     { LS.set('hr_leaves', S.leaves); }
function saveEmployees()  { LS.set('hr_employees', S.employees); }
function saveNotifMessages() { LS.set('hr_notif_messages', S.notifMessages); }
function saveRemoteSettings() { LS.set('hr_remote_settings', S.remoteSettings); }
function saveNotifCards() { LS.set('hr_notif_cards', S.notifCards); }

// ── API ──
async function sheetAPI(action, data = {}) {
  if (!CONFIG.SHEET_API_URL || CONFIG.SHEET_API_URL.startsWith('YOUR')) return null;
  try {
    const params = new URLSearchParams({ action, payload: JSON.stringify(data) });
    const res = await fetch(CONFIG.SHEET_API_URL + '?' + params.toString());
    return res.json();
  } catch(e) { console.warn('API error:', e); return null; }
}

async function loadEmployeesFromSheets() {
  try {
    const res = await sheetAPI('getEmployees');
    if (res && res.ok && res.data && res.data.length > 0) {
      return res.data.map(e => ({
        id:       e.email,
        email:    e.email,
        name:     e.name || e.email,
        role:     e.role || 'staff',
        dept:     e.dept || '',
        hireDate: e.hireDate || null,
      }));
    }
    return [];
  } catch(e) { return []; }
}

// ── 特休計算 ──
function calcAnnualLeave(hireDate) {
  if (!hireDate) return null;
  const hire = new Date(hireDate);
  if (isNaN(hire.getTime())) return null;
  const today = new Date();
  const months = (today.getFullYear()-hire.getFullYear())*12 + (today.getMonth()-hire.getMonth()) + (today.getDate()>=hire.getDate()?0:-1);
  if (months < 6)   return 0;
  if (months < 12)  return 3;
  if (months < 24)  return 7;
  if (months < 36)  return 10;
  if (months < 60)  return 14;
  if (months < 120) return 15;
  return Math.min(30, 15 + Math.floor(months/12) - 10 + 1);
}

// ── Utils ──
function toast(msg, dur=2500) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}
function fmtTime(d) {
  if (!d) return '-';
  const dt = new Date(d);
  return `${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
}
function todayStr() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
}
function isLate(iso) {
  const dt = new Date(iso);
  const [h,m] = CONFIG.CHECKIN_TIME.split(':').map(Number);
  return dt.getHours() > h || (dt.getHours()===h && dt.getMinutes()>m);
}
function getUserLeaveUsed(userId, typeId) {
  const year = new Date().getFullYear();
  return S.leaves.filter(l => l.userId===userId && l.type===typeId && l.status==='approved' && new Date(l.startDate).getFullYear()===year).reduce((s,l)=>s+(l.days||1),0);
}

// ── 兩階段審批邏輯 ──
function getNextApprover(leave) {
  const applicant = S.employees.find(e => e.id === leave.userId);
  if (!applicant) return null;
  if (leave.status === 'pending') {
    if (applicant.role === 'ceo' || applicant.role === 'manager') return 'ceo';
    const hasMgr = S.employees.some(e => e.role==='manager' && e.dept===applicant.dept);
    return hasMgr ? 'manager' : 'ceo';
  }
  if (leave.status === 'manager_approved') return 'ceo';
  return null;
}
function canApproveLeave(leave) {
  const u = S.currentUser;
  const next = getNextApprover(leave);
  if (u.role === 'ceo' && (next === 'ceo')) return true;
  if (u.role === 'manager' && next === 'manager') {
    const applicant = S.employees.find(e => e.id === leave.userId);
    return applicant && applicant.dept === u.dept;
  }
  return false;
}
function getPendingCount() {
  if (!S.currentUser || S.currentUser.role === 'staff') return 0;
  return S.leaves.filter(l => (l.status==='pending'||l.status==='manager_approved') && canApproveLeave(l)).length;
}

// ── 打卡通知訊息 ──
function buildCheckinMessage(name, isLateFlag, n) {
  const cards = S.notifCards && S.notifCards.length > 0 ? S.notifCards : DEFAULT_NOTIF_CARDS;
  // 找第一個符合的
  let tpl = '';
  if (isLateFlag) {
    const lateCard = cards.find(c => c.label.includes('遲到'));
    tpl = lateCard ? lateCard.message : DEFAULT_NOTIF_MESSAGES.late;
  } else if (n === 1) {
    const c = cards.find(c => c.label.includes('1') || c.label.includes('第一') || c.label.includes('first'));
    tpl = c ? c.message : DEFAULT_NOTIF_MESSAGES.first;
  } else if (n === 2) {
    const c = cards.find(c => c.label.includes('2') || c.label.includes('第二') || c.label.includes('second'));
    tpl = c ? c.message : DEFAULT_NOTIF_MESSAGES.second;
  } else {
    const c = cards.find(c => c.label.includes('3') || c.label.includes('以後') || c.label.includes('other'));
    tpl = c ? c.message : DEFAULT_NOTIF_MESSAGES.others;
  }
  if (!tpl && cards.length > 0) tpl = cards[cards.length-1].message;
  return tpl.replace(/{name}/g, name).replace(/{n}/g, n);
}
function buildCheckoutMessage(name, hours) {
  const cards = S.notifCards && S.notifCards.length > 0 ? S.notifCards : DEFAULT_NOTIF_CARDS;
  const c = cards.find(c => c.label.includes('下班'));
  const tpl = c ? c.message : DEFAULT_NOTIF_MESSAGES.checkout;
  return tpl.replace(/{name}/g, name).replace(/{hours}/g, hours);
}
function getTodayCheckinCount() {
  const today = todayStr();
  return S.attendance.filter(a => a.date === today && a.checkIn).length;
}

// ── 打卡彈窗 ──
function showCheckinPopup(message, time, isCheckout) {
  const icon = isCheckout ? '🌙' : '✅';
  const title = isCheckout ? '下班打卡成功' : '上班打卡成功';
  const overlay = document.createElement('div');
  overlay.className = 'checkin-popup-overlay';
  overlay.innerHTML = `
    <div class="checkin-popup">
      <div class="checkin-popup-icon">${icon}</div>
      <div class="checkin-popup-title">${title}</div>
      <div class="checkin-popup-msg">${message}</div>
      <div class="checkin-popup-time">${time}</div>
      <button class="checkin-popup-btn" onclick="this.closest('.checkin-popup-overlay').remove()">確認</button>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if(e.target===overlay) overlay.remove(); });
  setTimeout(() => overlay.remove(), 8000);
}

// ── Render ──
function render() {
  const app = document.getElementById('app');
  if (!S.appReady) {
    app.innerHTML = `<div class="loading-screen"><div class="loading-spinner"></div><div class="loading-text">載入中…</div></div>`;

  app.innerHTML = `
    <div class="layout"><div class="main">${renderPage()}</div></div>

  startClock();
}

function renderTopbar(pages, pending) {

// ── Clock ──
function renderClock() {
  const u = S.currentUser;
  const today = todayStr();
  const rec = S.attendance.find(a => a.userId===u.id && a.date===today);
  const clockedIn  = rec && rec.checkIn;
  const clockedOut = rec && rec.checkOut;
  let statusHtml = '';
  if (clockedOut) statusHtml = `<div class="clock-status clocked-out">今日已下班 ${fmtTime(rec.checkOut)}</div>`;
  else if (clockedIn) statusHtml = `<div class="clock-status clocked-in">上班中 · ${fmtTime(rec.checkIn)}${isLate(rec.checkIn)?' · ⚠️ 遲到':''}</div>`;
  const recent = S.attendance.filter(a=>a.userId===u.id).sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,7);

  return `
  <div class="card page-card">
    ${renderPageHeader()}

      </div>
      ${statusHtml}
    </div>
  </div>
  <div class="card">
    <div class="card-title">本週紀錄</div>
    ${recent.length?`<div class="table-wrap"><table>
      <thead><tr><th>日期</th><th>上班</th><th>下班</th><th>工時</th><th>狀態</th></tr></thead>
      <tbody>${recent.map(r=>{

async function doLogin() {
  const email = document.getElementById('login-email')?.value?.trim();
  const pass  = document.getElementById('login-pass')?.value;
  const errEl = document.getElementById('login-error');
  const btn   = document.getElementById('login-btn');
  const spinner = document.getElementById('login-spinner');
  if (!email||!pass) { if(errEl){errEl.textContent='請填寫 Email 和密碼';errEl.style.display='block';} return; }
  if (errEl) errEl.style.display='none';
  if (btn) { btn.disabled=true; btn.textContent='登入中…'; }
  if (spinner) spinner.style.display='block';
  try {
    const cred = await window._fbSignIn(window._fbAuth, email, pass);
    let emp = S.employees.find(e => e.email===cred.user.email);
    if (!emp) {
      const fresh = await loadEmployeesFromSheets();
      if (fresh.length>0) { S.employees=fresh; saveEmployees(); }
      emp = S.employees.find(e => e.email===cred.user.email);
    }
    if (!emp) {
      toast('此帳號不在員工名單中，請聯絡管理員');
      await window._fbSignOut(window._fbAuth);
      if (btn) { btn.disabled=false; btn.textContent='登入'; }
      if (spinner) spinner.style.display='none';
      return;
    }
    S.currentUser = emp;
    S.page = 'clock';
    render();
  } catch(e) {
    const msg = e.code==='auth/invalid-credential'||e.code==='auth/wrong-password' ? 'Email 或密碼錯誤'
      : e.code==='auth/user-not-found' ? '找不到此帳號'
      : e.code==='auth/too-many-requests' ? '登入嘗試次數過多，請稍後再試'
      : `登入失敗：${e.message}`;
    if (errEl) { errEl.textContent=msg; errEl.style.display='block'; }
    if (btn) { btn.disabled=false; btn.textContent='登入'; }
    if (spinner) spinner.style.display='none';
  }
}

// ── 地理位置驗證 ──
function calcDistance(lat1, lng1, lat2, lng2) {
  const R = 6371000; // 地球半徑（公尺）
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function isRemoteAllowedToday(userId) {
  const settings = S.remoteSettings[userId];
  if (!settings || settings.length === 0) return false;
  const todayDow = new Date().getDay(); // 0=日, 1=一, ..., 6=六
  return settings.includes(todayDow);
}

function checkLocation() {
  return new Promise((resolve, reject) => {
    // 如果今天是允許遠端的日子，直接跳過 GPS
    if (S.currentUser && isRemoteAllowedToday(S.currentUser.id)) {
      resolve({ dist: 0, remote: true });
      return;
    }
    if (!navigator.geolocation) {
      reject(new Error('此裝置不支援定位功能'));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos => {
        const dist = calcDistance(
          pos.coords.latitude, pos.coords.longitude,
          CONFIG.OFFICE_LAT, CONFIG.OFFICE_LNG
        );
        resolve({ dist: Math.round(dist), lat: pos.coords.latitude, lng: pos.coords.longitude });
      },
      err => {
        const msg = err.code === 1 ? '請允許定位權限才能打卡'
          : err.code === 2 ? '無法取得位置，請確認 GPS 已開啟'
          : '定位逾時，請重試';
        reject(new Error(msg));
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  });
}

async function doCheckIn() {
  const u = S.currentUser;
  // 先驗證位置
  toast('正在確認位置…');
  try {
    const geo = await checkLocation();
    if (geo.dist > CONFIG.GEO_LIMIT) {
      showGeoError(geo.dist);
      return;
    }
  } catch(e) {
    toast(e.message);
    return;
  }
  const now = new Date();
  const today = todayStr();
  const late = isLate(now.toISOString());
  const rec = { id:Date.now().toString(), userId:u.id, date:today, checkIn:now.toISOString(), checkOut:null };
  S.attendance.push(rec);
  saveAttendance();
  const n = getTodayCheckinCount();
  const msg = buildCheckinMessage(u.name, late, n);
  const isRemote = geo && geo.remote;
  const timeStr = `打卡時間：${fmtTime(now.toISOString())}${late?' · ⚠️ 遲到':''}${isRemote?' · 🏠 遠端':''}`;
  showCheckinPopup(msg, timeStr, false);
  await sheetAPI('addAttendance', { ...rec, name:u.name, dept:u.dept, late });
  render();
}

async function doCheckOut() {
  const u = S.currentUser;
  // 先驗證位置
  toast('正在確認位置…');
  try {
    const geo = await checkLocation();
    if (geo.dist > CONFIG.GEO_LIMIT) {
      showGeoError(geo.dist);
      return;
    }
  } catch(e) {
    toast(e.message);
    return;
  }
  const today = todayStr();
  const now = new Date();
  const idx = S.attendance.findIndex(a=>a.userId===u.id&&a.date===today&&!a.checkOut);
  if (idx===-1) { toast('找不到今日打卡記錄'); return; }
  S.attendance[idx].checkOut = now.toISOString();
  saveAttendance();
  const hrs = ((now-new Date(S.attendance[idx].checkIn))/3600000).toFixed(1);
  const msg = buildCheckoutMessage(u.name, hrs);
  const timeStr = `下班時間：${fmtTime(now.toISOString())}`;
  showCheckinPopup(msg, timeStr, true);
  await sheetAPI('updateCheckout', { id:S.attendance[idx].id, checkOut:now.toISOString(), hours:hrs });
  render();
}

  const u = S.currentUser;
  const type=document.getElementById('m-type').value;

  const end=document.getElementById('m-end').value;
  const reason=document.getElementById('m-reason').value;
  if (!start||!end) { toast('請填寫日期'); return; }
  const days=Math.round((new Date(end)-new Date(start))/86400000)+1;
  const lt=LEAVE_TYPES.find(x=>x.id===type);
  if (!lt.unlimited) {
    const quota=lt.dynamic?calcAnnualLeave(u.hireDate):lt.quota;
    if (lt.dynamic&&quota===null) { toast('尚未設定到職日，請聯絡管理員'); return; }
    const used=getUserLeaveUsed(u.id,type);
    if (used+days>quota) { toast(`${lt.name}額度不足（剩餘 ${quota-used} 天）`); return; }
  }
  const leave={ id:Date.now().toString(), userId:u.id, type, startDate:start, endDate:end, days, reason, status:'pending', applyDate:new Date().toISOString() };
  S.leaves.push(leave);
  saveLeaves();
  toast('申請已送出，等待審批');
  await sheetAPI('addLeave', { ...leave, name:u.name, dept:u.dept, typeName:lt.name });
  closeModal();
}

async function approveLeave(leaveId) {
  const u = S.currentUser;
  const idx = S.leaves.findIndex(l=>l.id===leaveId);
  if (idx===-1) return;
  const leave = S.leaves[idx];
  const next = getNextApprover(leave);
  if (u.role==='manager' && next==='manager') {
    S.leaves[idx].status='manager_approved';
    S.leaves[idx].managerName=u.name;
    toast('已核准，等待 CEO 最終確認');
    await sheetAPI('updateLeaveStatus', { id:leaveId, status:'manager_approved', approvedBy:u.name });
  } else if (u.role==='ceo' && next==='ceo') {
    S.leaves[idx].status='approved';
    S.leaves[idx].ceoName=u.name;
    toast('已最終核准');
    await sheetAPI('updateLeaveStatus', { id:leaveId, status:'approved', approvedBy:u.name });
  }
  saveLeaves();
  render();
}

async function confirmReject() {
  const u = S.currentUser;
  const reason=document.getElementById('m-reject-reason').value;
  const leaveId=S._rejectTarget;
  const idx=S.leaves.findIndex(l=>l.id===leaveId);
  if (idx===-1) return;
  S.leaves[idx].status='rejected';
  S.leaves[idx].rejectReason=reason;
  S.leaves[idx].rejectedBy=u.name;
  if (u.role==='ceo') S.leaves[idx].ceoRejected=true;
  saveLeaves();
  toast('已拒絕');
  await sheetAPI('updateLeaveStatus', { id:leaveId, status:'rejected', rejectReason:reason, rejectedBy:u.name });
  closeModal();
}

function addNotifCard() {

function removeNotifCard(idx) {

function saveNotifCardsAction() {

}

function resetNotifCards() {
  S.notifCards = [...DEFAULT_NOTIF_CARDS];
  saveNotifCards();

}

async function refreshEmployees() {
  toast('重新載入中…');
  const fresh=await loadEmployeesFromSheets();
  if (fresh.length>0) { S.employees=fresh; saveEmployees(); toast(`已載入 ${fresh.length} 位員工`); render(); }

function openRemoteModal(empId, empName) {
  S._remoteTarget = { id: empId, name: empName };

  render();
}

function toggleRemoteDay(empId, dow) {
  if (!S.remoteSettings[empId]) S.remoteSettings[empId] = [];
  const idx = S.remoteSettings[empId].indexOf(dow);
  if (idx === -1) S.remoteSettings[empId].push(dow);
  else S.remoteSettings[empId].splice(idx, 1);
  render();
}

function saveRemoteSettingsAction() {
  saveRemoteSettings();
  toast('遠端打卡設定已儲存');
  closeModal();
}

function exportCSV(empId) {
  const emp=S.employees.find(e=>e.id===empId);
  const recs=S.attendance.filter(a=>a.userId===empId).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const rows=[['日期','上班時間','下班時間','工時','狀態']];
  recs.forEach(r=>{
    const hrs=r.checkIn&&r.checkOut?((new Date(r.checkOut)-new Date(r.checkIn))/3600000).toFixed(1):'';
    rows.push([r.date,fmtTime(r.checkIn),fmtTime(r.checkOut),hrs,r.checkIn&&isLate(r.checkIn)?'遲到':'正常']);
  });
  const blob=new Blob(['\uFEFF'+rows.map(r=>r.join(',')).join('\n')],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`${emp?.name}_出勤記錄.csv`;
  a.click();
}

// ── Clock ticker ──
let clockInterval=null;
function startClock() {
  if (clockInterval) clearInterval(clockInterval);
  const tick=()=>{
    const el=document.getElementById('live-clock');
    const dt=document.getElementById('live-date');
    if (!el) { clearInterval(clockInterval); return; }
    const now=new Date();
    el.textContent=now.toLocaleTimeString('zh-TW',{hour12:false});
    if (dt) dt.textContent=now.toLocaleDateString('zh-TW',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  };
  tick();
  clockInterval=setInterval(tick,1000);
}

function bindEvents() {
  document.addEventListener('keydown', e=>{ if(e.key==='Escape'&&S.modal) closeModal(); },{once:true});
}

// ── Init ──
async function initApp() {
  loadLocalData();
  render();
  const fresh=await loadEmployeesFromSheets();
  if (fresh.length>0) { S.employees=fresh; saveEmployees(); }
  S.appReady=true;
  window._fbOnAuth(window._fbAuth, async firebaseUser=>{
    if (firebaseUser) {
      let emp=S.employees.find(e=>e.email===firebaseUser.email);
      if (!emp) {
        const f=await loadEmployeesFromSheets();
        if (f.length>0) { S.employees=f; saveEmployees(); }
        emp=S.employees.find(e=>e.email===firebaseUser.email);
      }
      if (emp) { S.currentUser=emp; S.page=S.page||'clock'; }
      else {
        S.currentUser=null;
        toast('此帳號不在員工名單中，請聯絡管理員');
        await window._fbSignOut(window._fbAuth);
      }
    } else { S.currentUser=null; }
    render();
  });
}

window.addEventListener('firebaseReady', initApp, {once:true});
if (window._fbAuth) initApp();
</script>

<script>
(function() {
  const canvas = document.getElementById('bg-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let W, H, particles = [], animId;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function initParticles() {
    particles = [];
    const count = Math.floor((W * H) / 18000);
    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.2 + 0.2,
        vx: (Math.random() - 0.5) * 0.15,
        vy: (Math.random() - 0.5) * 0.15,
        o: Math.random() * 0.4 + 0.1,
      });
    }
  }

  function drawBg() {
    // Base gradient
    const g = ctx.createLinearGradient(0, 0, W * 0.6, H);
    g.addColorStop(0, '#060d1a');
    g.addColorStop(0.4, '#080f20');
    g.addColorStop(0.7, '#0a1428');
    g.addColorStop(1, '#060d1a');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Orbs
    const orbs = [
      { x: W * 0.15, y: H * 0.2, r: W * 0.35, c1: 'rgba(20,60,180,0.18)', c2: 'rgba(10,30,100,0)' },
      { x: W * 0.85, y: H * 0.75, r: W * 0.3, c1: 'rgba(10,40,140,0.14)', c2: 'rgba(5,20,80,0)' },
      { x: W * 0.5, y: H * 0.5, r: W * 0.5, c1: 'rgba(15,40,120,0.08)', c2: 'rgba(0,0,0,0)' },
    ];
    orbs.forEach(o => {
      const rg = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r);
      rg.addColorStop(0, o.c1);
      rg.addColorStop(1, o.c2);
      ctx.fillStyle = rg;
      ctx.fillRect(0, 0, W, H);
    });
  }

  function drawParticles() {
    particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(160,200,255,${p.o})`;
      ctx.fill();
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = W;
      if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H;
      if (p.y > H) p.y = 0;
    });
  }

  function loop() {
    drawBg();
    drawParticles();
    animId = requestAnimationFrame(loop);
  }

  resize();
  initParticles();
  loop();
  window.addEventListener('resize', () => { resize(); initParticles(); });
})();
</script>
